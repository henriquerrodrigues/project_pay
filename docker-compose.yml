services:
  postgres:
    image: postgres:16
    container_name: project_pay_db
    environment:
      POSTGRES_USER: pay_user
      POSTGRES_PASSWORD: pay_pass
      POSTGRES_DB: project_pay
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: project_pay_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
